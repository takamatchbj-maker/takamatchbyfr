<!doctype html>
<html lang="fr" data-page="profil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Profil TakaMatch</title>
<meta name="description" content="Une fiche TakaMatch : un projet qui cherche ses cofondateurs, ou un talent prêt à en rejoindre un.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script>try{var t=localStorage.getItem('tm-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="css/variables.css?v=20261009b">
<link rel="stylesheet" href="css/base.css?v=20261009b">
<link rel="stylesheet" href="css/components.css?v=20261009b">
<script src="js/supabase.js?v=20261009b"></script>
<style>
body{background:var(--bg);color:var(--ink);font-family:var(--sans, Inter, system-ui, sans-serif);margin:0;min-height:100vh}
.pf-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;max-width:980px;margin:0 auto}
.pf-top img{height:30px;display:block}
.pf-top .row{display:flex;gap:8px}
.pf{max-width:980px;margin:0 auto;padding:8px 20px 60px}
.pf-hero{display:flex;align-items:center;gap:16px;margin:18px 0 22px}
.pf-av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:22px;color:#fff;flex:0 0 auto;position:relative;overflow:hidden}
.pf-av.tal{background:linear-gradient(135deg,#3FA3EE,#0A5C99)}
.pf-av.vis{background:linear-gradient(135deg,#FFE27A,#C9941A);color:#3d2b04}
.pf-av svg{width:26px;height:26px}
.pf-h{font-family:var(--disp, 'Source Serif 4', serif);font-size:clamp(24px,4vw,32px);font-weight:600;margin:0;line-height:1.15}
.pf-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;color:var(--ink-2);font-size:14px}
.pf-handle{font-family:var(--mono, "IBM Plex Mono", monospace);font-size:13px;background:#1c1b19;color:#fff;padding:3px 8px;border-radius:7px}
.pf-badge{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600}
.pf-badge svg{width:15px;height:15px}
.pf-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:820px){.pf-grid{grid-template-columns:1fr}}
.pf-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pf-card + .pf-card{margin-top:18px}
.pf-cover{height:150px;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,#FFE890,#E2A70F);background-size:cover;background-position:center;position:relative}
.pf-cover.photo{font-size:0}
.pf-tags{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.pf-tag{background:rgba(255,255,255,.88);color:#2a2620;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px}
.pf-b{padding:20px 22px 22px}
.pf-kind{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.pf-b h2{font-family:var(--disp, 'Source Serif 4', serif);font-size:24px;font-weight:600;margin:0 0 8px}
.pf-lead{font-size:15.5px;line-height:1.6;color:var(--ink);margin:0}
.pf-sec{margin-top:18px}
.pf-sec h3{font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 6px;display:flex;align-items:center;gap:7px}
.pf-sec p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.pf-chips{display:flex;flex-wrap:wrap;gap:6px}
.pf-chip{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.pf-chip.tal{background:var(--tal-50,#EAF4FC);border-color:transparent;color:var(--tal-700,#0A5C99)}
.pf-chip.vis{background:var(--vis-50,#FFF7D6);border-color:transparent;color:var(--vis-700,#8A6008)}
.pf-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.pf-fact{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.pf-fact b{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;margin-bottom:2px}
.pf-fact span{font-size:14px;font-weight:600}
.pf-side{position:sticky;top:16px}
.pf-cta{padding:20px}
.pf-cta h3{font-family:var(--disp, 'Source Serif 4', serif);font-size:19px;margin:0 0 8px}
.pf-cta p{font-size:14px;line-height:1.55;color:var(--ink-2);margin:0 0 14px}
.pf-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;border-radius:12px;font-weight:700;font-size:14.5px;text-decoration:none;border:1px solid transparent;box-sizing:border-box}
.pf-btn + .pf-btn{margin-top:8px}
.pf-btn.a{background:#FFD741;color:#2b2105}
.pf-btn.b{background:#007CD8;color:#fff}
.pf-btn.g{background:transparent;border-color:var(--line);color:var(--ink)}
.pf-note{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:12px;display:flex;gap:7px}
.pf-note svg{width:15px;height:15px;flex:0 0 auto;margin-top:1px}
.pf-empty{text-align:center;padding:70px 20px}
.pf-empty h1{font-family:var(--disp, 'Source Serif 4', serif);font-size:28px;margin:0 0 10px}
.pf-empty p{color:var(--ink-2);margin:0 auto 20px;max-width:46ch;line-height:1.6}
.pf-empty .pf-btn{max-width:260px;margin:0 auto}
.pf-load{display:grid;place-items:center;min-height:60vh;color:var(--ink-3)}
.pf-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pf-tabs a{font-size:13.5px;font-weight:600;padding:8px 13px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);text-decoration:none;background:var(--surface)}
.pf-tabs a.on{background:#1c1b19;color:#fff;border-color:#1c1b19}
</style>
</head>
<body>
<header class="pf-top">
  <a href="index.html" aria-label="TakaMatch, accueil"><img src="assets/images/logo-principal.svg" alt="TakaMatch"></a>
  <div class="row"><a class="pf-btn g" style="width:auto;height:38px;padding:0 14px" href="inscription.html?mode=login">Se connecter</a></div>
</header>
<main class="pf" id="pf"><div class="pf-load">Chargement de la fiche…</div></main>
<script>
(function(){
  'use strict';
  var q = new URLSearchParams(location.search);
  var H = (q.get('h') || '').replace(/^@/, '').trim(), R = q.get('r') || '', PID = q.get('p') || '';
  var box = document.getElementById('pf');

  /* Déjà connecté sur ce navigateur : la fiche s'ouvre dans TakaMatch. */
  async function maybeApp(){
    if(q.get('public') === '1' || !window.TMDB) return false;
    var s = null; try{ s = await TMDB.ensure(); }catch(e){}
    if(!s) return false;
    location.replace('app.html?voir=' + encodeURIComponent(H) + (R ? '&r=' + R : '') + (PID ? '&p=' + encodeURIComponent(PID) : ''));
    return true;
  }

  var SKILLS = {'dev-mobile':'Dev mobile','dev-front':'Dev front-end','dev-back':'Dev back-end','data':'Data & IA','design':'UX / UI Design','brand':'Identité de marque',
    'growth':'Growth & Acquisition','contenu':'Contenu & Communauté','vente':'Vente & Partenariats','produit':'Product management','finance':'Finance & Levée',
    'juridique':'Juridique & OHADA','terrain':'Opérations terrain','rh':'Recrutement & RH'};
  var SECTORS = {agritech:['AgriTech','🌱'],fintech:['FinTech','💳'],edtech:['EdTech','📚'],health:['HealthTech','🩺'],logistique:['Logistique','🚚'],ecommerce:['E-commerce','🛍️'],
    immobilier:['Immobilier','🏘️'],greentech:['GreenTech','🌍'],medias:['Médias & Contenu','🎬'],saas:['SaaS & Outils B2B','🧰'],artisanat:['Artisanat & Culture','🎨'],impact:['Impact Social','🤝']};
  var PACE = {side:'Projet à côté · moins de 10 h / semaine', serieux:'Engagement sérieux · 10 à 25 h / semaine', plein:'Temps plein · plus de 25 h / semaine'};
  var OFFER = {equity:'Parts au capital', mixte:'Parts + petite rémunération', paye:'Rémunération prévue'};
  var LEVEL = {deb:'Débutant', inter:'Intermédiaire', expert:'Expert'};
  var DIPLOMA = {autodidacte:'Autodidacte', bepc:'BEPC', bac:'Baccalauréat', bts:'BTS / DUT', licence:'Licence', master:'Master / Ingénieur', doctorat:'Doctorat'};
  var STATUS = {freelance:'Freelance', entreprise:'En entreprise', autoentr:'Auto-entrepreneur', etudiant:'Étudiant', sansact:'Sans activité'};
  var VB = 'M16 8.375C16 8.93437 15.8656 9.45312 15.5969 9.92813C15.3281 10.4031 14.9688 10.775 14.5156 11.0344C14.5281 11.1188 14.5344 11.25 14.5344 11.4281C14.5344 12.275 14.25 12.9937 13.6875 13.5875C13.1219 14.1844 12.4406 14.4812 11.6438 14.4812C11.2875 14.4812 10.9469 14.4156 10.625 14.2844C10.375 14.7969 10.0156 15.2094 9.54375 15.525C9.075 15.8438 8.55937 16 8 16C7.42812 16 6.90938 15.8469 6.44688 15.5344C5.98125 15.225 5.625 14.8094 5.375 14.2844C5.05312 14.4156 4.71562 14.4812 4.35625 14.4812C3.55937 14.4812 2.875 14.1844 2.30312 13.5875C1.73125 12.9937 1.44687 12.2719 1.44687 11.4281C1.44687 11.3344 1.45938 11.2031 1.48125 11.0344C1.02813 10.7719 0.66875 10.4031 0.4 9.92813C0.134375 9.45312 0 8.93437 0 8.375C0 7.78125 0.15 7.23438 0.446875 6.74062C0.74375 6.24687 1.14375 5.88125 1.64375 5.64375C1.5125 5.2875 1.44687 4.92812 1.44687 4.57188C1.44687 3.72813 1.73125 3.00625 2.30312 2.4125C2.875 1.81875 3.55937 1.51875 4.35625 1.51875C4.7125 1.51875 5.05312 1.58438 5.375 1.71563C5.625 1.20312 5.98438 0.790625 6.45625 0.475C6.925 0.159375 7.44063 0 8 0C8.55937 0 9.075 0.159375 9.54375 0.471875C10.0125 0.7875 10.375 1.2 10.625 1.7125C10.9469 1.58125 11.2844 1.51562 11.6438 1.51562C12.4406 1.51562 13.1219 1.8125 13.6875 2.40937C14.2531 3.00625 14.5344 3.725 14.5344 4.56875C14.5344 4.9625 14.475 5.31875 14.3562 5.64062C14.8562 5.87813 15.2563 6.24375 15.5531 6.7375C15.85 7.23438 16 7.78125 16 8.375ZM7.65938 10.7844L10.9625 5.8375C11.0469 5.70625 11.0719 5.5625 11.0437 5.40938C11.0125 5.25625 10.9344 5.13438 10.8031 5.05312C10.6719 4.96875 10.5281 4.94063 10.375 4.9625C10.2188 4.9875 10.0938 5.0625 10 5.19375L7.09062 9.56875L5.75 8.23125C5.63125 8.1125 5.49375 8.05625 5.34062 8.0625C5.18437 8.06875 5.05 8.125 4.93125 8.23125C4.825 8.3375 4.77187 8.47187 4.77187 8.63437C4.77187 8.79375 4.825 8.92813 4.93125 9.0375L6.77187 10.8781L6.8625 10.95C6.96875 11.0219 7.07812 11.0562 7.18437 11.0562C7.39375 11.0531 7.55313 10.9656 7.65938 10.7844Z';
  var LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10.5" width="16" height="10.5" rx="2.4"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>';
  var INFO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8h.01"/></svg>';

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function chips(list, cls){ return '<div class="pf-chips">' + (list || []).map(function(k){ return '<span class="pf-chip ' + (cls || '') + '">' + esc(SKILLS[k] || k) + '</span>'; }).join('') + '</div>'; }
  function secChips(list){ return '<div class="pf-chips">' + (list || []).map(function(k){ var s = SECTORS[k] || [k, '✨']; return '<span class="pf-chip">' + s[1] + ' ' + esc(s[0]) + '</span>'; }).join('') + '</div>'; }
  function sec(t, body){ return body ? '<div class="pf-sec"><h3>' + esc(t) + '</h3>' + body + '</div>' : ''; }
  function txt(s){ return s ? '<p>' + esc(s) + '</p>' : ''; }
  function badge(ok, role){
    var c = ok ? (role === 'vis' ? '#E2A70F' : '#007CD8') : '#C9C3B6';
    return '<span class="pf-badge" style="color:' + (ok ? c : 'var(--ink-3)') + '"><svg viewBox="0 0 16 16" fill="' + c + '"><path d="' + VB + '"/></svg>' + (ok ? 'Profil vérifié' : 'Pas encore vérifié') + '</span>';
  }

  function projectCard(p){
    var cover = p.cover ? ' class="pf-cover photo" style="background-image:url(' + esc(p.cover) + ')"' : ' class="pf-cover"';
    return '<article class="pf-card"><div' + cover + '>' + (p.cover ? '' : esc(p.glyph || '💡'))
      + '<span class="pf-tags">' + (p.sectors || []).slice(0, 3).map(function(k){ var s = SECTORS[k] || [k, '✨']; return '<span class="pf-tag">' + s[1] + ' ' + esc(s[0]) + '</span>'; }).join('') + '</span></div>'
      + '<div class="pf-b"><div class="pf-kind">Fiche projet</div><h2>' + esc(p.title || 'Projet') + '</h2>'
      + '<p class="pf-lead">' + esc(p.hook || '') + '</p>'
      + sec('La Vision', txt(p.vision)) + sec('La Traction', txt(p.traction)) + sec('Les Ressources sécurisées', txt(p.assets)) + sec('Les Défis', txt(p.challenges))
      + sec('Compétences recherchées', (p.seeking || []).length ? chips(p.seeking, 'vis') : '')
      + '<div class="pf-facts"><div class="pf-fact"><b>Rythme attendu</b><span>' + esc(PACE[p.pace] || '—') + '</span></div>'
      + '<div class="pf-fact"><b>Ce qui est proposé</b><span>' + esc(OFFER[p.offer] || '—') + '</span></div></div></div></article>';
  }
  function persoCard(x){
    if(!x || (!x.bio && !(x.skills || []).length)) return '';
    return '<article class="pf-card"><div class="pf-b"><div class="pf-kind">Fiche perso du porteur</div><h2>La personne derrière le projet</h2>'
      + (x.bio ? '<p class="pf-lead">' + esc(x.bio) + '</p>' : '')
      + sec('Ce que le porteur apporte', (x.skills || []).length ? chips(x.skills, 'vis') : '')
      + (x.level ? '<div class="pf-facts"><div class="pf-fact"><b>Expérience</b><span>' + esc(LEVEL[x.level] || x.level) + '</span></div></div>' : '') + '</div></article>';
  }
  function talentCard(t){
    return '<article class="pf-card"><div class="pf-b"><div class="pf-kind">Fiche Talent</div><h2>Ce que ce talent apporte</h2>'
      + '<p class="pf-lead">' + esc(t.bio || '') + '</p>'
      + sec('Compétences clés', chips(t.skills, 'tal')) + sec('Secteurs qui l\'attirent', (t.sectors || []).length ? secChips(t.sectors) : '')
      + '<div class="pf-facts"><div class="pf-fact"><b>Expérience</b><span>' + esc(LEVEL[t.level] || '—') + '</span></div>'
      + '<div class="pf-fact"><b>Temps disponible</b><span>' + esc(PACE[t.pace] || '—') + '</span></div>'
      + (t.diploma ? '<div class="pf-fact"><b>Diplôme</b><span>' + esc(DIPLOMA[t.diploma] || t.diploma) + '</span></div>' : '')
      + (t.status ? '<div class="pf-fact"><b>Statut</b><span>' + esc(STATUS[t.status] || t.status) + '</span></div>' : '') + '</div></div></article>';
  }
  function cta(role){
    var signup = role === 'vis' ? 'inscription.html?mode=signup&role=tal' : 'inscription.html?mode=signup&role=vis';
    return '<aside class="pf-side"><div class="pf-card pf-cta">'
      + '<h3>' + (role === 'vis' ? 'Ce projet t\'intéresse ?' : 'Ce talent t\'intéresse ?') + '</h3>'
      + '<p>' + (role === 'vis' ? 'Crée ton compte Talent gratuitement et propose-toi comme cofondateur.' : 'Publie ton projet sur TakaMatch et invite ce talent à le rejoindre comme cofondateur.') + '</p>'
      + '<a class="pf-btn ' + (role === 'vis' ? 'b' : 'a') + '" href="' + signup + '">Créer mon compte</a>'
      + '<a class="pf-btn g" href="inscription.html?mode=login">J\'ai déjà un compte</a>'
      + '<p class="pf-note">' + LOCK + '<span>Le nom, la photo et les coordonnées restent masqués jusqu\'au match : c\'est la règle pour tous sur TakaMatch.</span></p></div></aside>';
  }
  function empty(title, text){
    box.innerHTML = '<div class="pf-empty"><h1>' + esc(title) + '</h1><p>' + esc(text) + '</p><a class="pf-btn a" href="index.html">Découvrir TakaMatch</a></div>';
  }

  function render(d){
    var role = R === 'tal' || R === 'vis' ? R : (d.role || 'tal');
    var projects = d.projects || [];
    if(role === 'vis' && !projects.length && d.talent) role = 'tal';
    if(role === 'tal' && !d.talent && projects.length) role = 'vis';
    if(role === 'tal' && !d.talent) return empty('Fiche hors ligne', 'Cette personne a mis sa fiche hors ligne pour le moment. Elle n\'est pas visible.');
    if(role === 'vis' && !projects.length) return empty('Fiche hors ligne', 'Ce projet n\'est pas en ligne pour le moment.');
    var hero = '<div class="pf-hero"><span class="pf-av ' + role + '" aria-hidden="true">' + LOCK + '</span><div>'
      + '<h1 class="pf-h">' + (role === 'vis' ? 'Un projet qui cherche ses cofondateurs' : 'Un talent prêt à cofonder') + '</h1>'
      + '<div class="pf-meta"><span class="pf-handle">@' + esc(d.handle) + '</span>' + (d.city ? '<span>' + esc(d.city) + '</span>' : '') + badge(d.verified, role) + '</div></div></div>';
    var main;
    if(role === 'vis'){
      var cur = projects.filter(function(p){ return p.id === PID; })[0] || projects[0];
      var tabs = projects.length > 1 ? '<nav class="pf-tabs">' + projects.map(function(p){
          return '<a href="?h=' + encodeURIComponent(d.handle) + '&r=vis&p=' + p.id + (q.get('public') ? '&public=1' : '') + '" class="' + (p === cur ? 'on' : '') + '">' + esc((p.glyph || '') + ' ' + p.title) + '</a>'; }).join('') + '</nav>' : '';
      main = tabs + projectCard(cur) + persoCard(d.perso);
      document.title = (cur.title || 'Projet') + ' · TakaMatch';
    } else {
      main = talentCard(d.talent);
      document.title = '@' + d.handle + ' · Talent TakaMatch';
    }
    box.innerHTML = hero + '<div class="pf-grid"><div>' + main + '</div>' + cta(role) + '</div>';
  }

  (async function(){
    if(!H) return empty('Lien incomplet', 'Ce lien ne mène à aucune fiche. Vérifie qu\'il a été copié en entier.');
    if(await maybeApp()) return;
    try{
      var d = await TMDB.rpc('public_profile', {p_handle:H});
      if(!d) return empty('Fiche introuvable', 'Aucune fiche ne correspond à @' + H + '. Le pseudo a peut-être changé.');
      render(d);
    }catch(e){ empty('Fiche indisponible', e.message || 'Réessaie dans un instant.'); }
  })();
})();
</script>
</body>
</html>
