<!doctype html>
<html lang="fr" data-default="404">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TakaMatch — Un petit détour</title>
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1815" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<!-- ============================================================
     TakaMatch — page d'erreur commune
     Une seule page pour tous les incidents. Le type d'erreur se
     choisit dans l'adresse : erreur.html?type=google (voir ERRORS
     plus bas). 404.html est une copie de ce fichier : GitHub Pages
     l'affiche pour toute adresse qui n'existe pas.
     Autonome : styles et script sont dans ce fichier, pour qu'elle
     s'affiche même si le reste du site ne se charge pas.
     ============================================================ -->
<script>
  /* Thème : celui choisi sur le site, sinon celui de l'appareil. */
  (function(){ var t = null; try{ t = localStorage.getItem('tm-theme'); }catch(e){}
    if(t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t); })();
</script>
<style>
  :root{
    --ground:#F4F1EA; --surface:#FAF9F5; --surface-2:#F2EFE7; --line:#E4E0D6; --line-strong:#D2CCBC;
    --ink:#1F1E1B; --ink-2:#5D5A52; --ink-3:#706C5E;
    --tal:#007CD8; --tal-soft:#DAE6F1; --tal-ink:#0A5C99;
    --vis:#FFD741; --vis-soft:#F2E6BE; --vis-ink:#8A6008;
    --glow-1:rgba(255,215,65,.30); --glow-2:rgba(0,124,216,.16);
    --btn:#1F1E1B; --btn-on:#FAF9F5;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --disp:"Source Serif 4",Georgia,"Times New Roman",serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  :root[data-theme="dark"]{
    --ground:#1A1815; --surface:#22201C; --surface-2:#282521; --line:#37332D; --line-strong:#4A453D;
    --ink:#F2EFE8; --ink-2:#BDB7AC; --ink-3:#A49E92;
    --tal:#3FA3EE; --tal-soft:#1A3244; --tal-ink:#9CD1FA;
    --vis:#FFD741; --vis-soft:#3B300C; --vis-ink:#F0CE6F;
    --glow-1:rgba(255,215,65,.10); --glow-2:rgba(63,163,238,.12);
    --btn:#F2EFE8; --btn-on:#1A1815;
  }
  *{box-sizing:border-box;margin:0}
  html{min-height:100%;background:var(--ground);background-image:radial-gradient(60% 50% at 12% 0%,var(--glow-1),transparent 70%),radial-gradient(55% 45% at 100% 100%,var(--glow-2),transparent 70%)}
  body{font-family:var(--sans);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:24px 16px 32px}
  .top{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;margin-bottom:clamp(24px,7vh,64px)}
  .top img{height:30px;width:auto;display:block}
  :root[data-theme="dark"] .top img{filter:brightness(1.05)}
  .theme{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);width:38px;height:38px;border-radius:999px;display:grid;place-items:center;cursor:pointer}
  .theme:hover{color:var(--ink);border-color:var(--line-strong)}
  .theme svg{width:18px;height:18px}

  main{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(28px,6vw,48px) clamp(20px,6vw,48px);
    box-shadow:0 1px 2px rgba(31,30,27,.04),0 24px 60px -30px rgba(31,30,27,.25);text-align:center;animation:rise .5s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .art{width:min(260px,70%);height:auto;margin:0 auto 22px;display:block}
  .art .bulb{fill:var(--vis);stroke:var(--vis-ink)}
  .art .tool{fill:var(--tal);stroke:var(--tal-ink)}
  .art .halo-v{fill:var(--vis-soft)} .art .halo-t{fill:var(--tal-soft)}
  .art .gap{stroke:var(--line-strong)}
  .art .spark{fill:var(--ink-3)}
  .art .float-a{animation:fa 4.5s ease-in-out infinite} .art .float-b{animation:fb 4.5s ease-in-out infinite}
  @keyframes fa{50%{transform:translate(-3px,-4px)}} @keyframes fb{50%{transform:translate(3px,4px)}}

  .tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-3);
    background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;margin-bottom:16px}
  .tag i{width:7px;height:7px;border-radius:50%;background:var(--vis);box-shadow:0 0 0 3px var(--vis-soft)}
  .tag.info i{background:var(--tal);box-shadow:0 0 0 3px var(--tal-soft)}
  h1{font-family:var(--disp);font-weight:600;font-size:clamp(26px,5.4vw,34px);line-height:1.15;letter-spacing:-.01em;margin-bottom:12px;text-wrap:balance}
  h1 em{font-style:normal;color:var(--tal-ink)}
  .lead{font-size:16px;line-height:1.6;color:var(--ink-2);max-width:42ch;margin:0 auto;text-wrap:pretty}
  .steps{list-style:none;padding:0;margin:20px auto 0;max-width:400px;text-align:left;display:grid;gap:8px}
  .steps li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.5;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px}
  .steps b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--ink-3);min-width:16px;padding-top:2px}

  .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:10px;font:600 15px/1 var(--sans);text-decoration:none;cursor:pointer;
    border:1px solid transparent;transition:transform .15s var(--ease),background .15s,border-color .15s}
  .btn:active{transform:scale(.98)}
  .btn svg{width:18px;height:18px}
  .btn-main{background:var(--btn);color:var(--btn-on)}
  .btn-main:hover{opacity:.9}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
  .btn-ghost:hover{background:var(--surface-2)}
  .btn:focus-visible,.theme:focus-visible,summary:focus-visible,.copy:focus-visible,a:focus-visible{outline:2px solid var(--tal);outline-offset:3px}

  details{margin-top:28px;border-top:1px solid var(--line);padding-top:16px;text-align:left}
  summary{cursor:pointer;font-size:13.5px;color:var(--ink-3);list-style:none;display:flex;align-items:center;justify-content:center;gap:6px}
  summary::-webkit-details-marker{display:none}
  summary svg{width:14px;height:14px;transition:transform .2s}
  details[open] summary svg{transform:rotate(180deg)}
  .tech{margin-top:12px;font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;position:relative;word-break:break-word}
  .copy{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:8px;font:500 12px var(--sans);padding:5px 9px;cursor:pointer}

  footer{margin-top:24px;font-size:13.5px;color:var(--ink-3);text-align:center;line-height:1.7}
  footer a{color:var(--ink-2);text-underline-offset:3px}
  @media (prefers-reduced-motion:reduce){main,.art .float-a,.art .float-b{animation:none}}
</style>
</head>
<body>
<header class="top">
  <a href="/" aria-label="Accueil TakaMatch"><img src="/assets/images/logo-principal.svg" alt="TakaMatch" width="113" height="30"></a>
  <button class="theme" id="theme" type="button" aria-label="Changer de thème"></button>
</header>

<main aria-labelledby="t">
  <!-- Illustration : l'idée (or) et la compétence (bleu) qui ne se sont pas encore rejointes. -->
  <svg class="art" viewBox="0 0 280 150" role="img" aria-hidden="true">
    <circle class="halo-v" cx="72" cy="78" r="54"/>
    <circle class="halo-t" cx="208" cy="78" r="54"/>
    <path class="gap" d="M130 78h20" stroke-width="2.5" stroke-dasharray="4 7" stroke-linecap="round" fill="none"/>
    <g transform="translate(-6 0)"><g class="float-a">
      <path class="bulb" stroke-width="2.5" d="M78 44c-15 0-26 11-26 25 0 9 5 16 11 21 3 3 4 6 4 9v4h22v-4c0-3 1-6 4-9 6-5 11-12 11-21 0-14-11-25-26-25z"/>
      <path d="M68 112h20M71 120h14" class="gap" stroke-width="3" stroke-linecap="round"/>
    </g></g>
    <g transform="translate(23 0)"><g class="float-b">
      <path class="tool" stroke-width="2.5" stroke-linejoin="round" d="M196 50a17 17 0 0 0-21 21l-24 24a7 7 0 0 0 10 10l24-24a17 17 0 0 0 21-21l-10 10-9-2-2-9z"/>
    </g></g>
    <circle class="spark" cx="140" cy="44" r="2.5"/><circle class="spark" cx="132" cy="114" r="2"/><circle class="spark" cx="150" cy="102" r="1.6"/>
  </svg>

  <span class="tag" id="tag"><i aria-hidden="true"></i><span id="code">Erreur</span></span>
  <h1 id="t">Un petit détour</h1>
  <p class="lead" id="lead">Quelque chose ne s'est pas passé comme prévu.</p>
  <ol class="steps" id="steps" hidden></ol>
  <div class="acts" id="acts"></div>

  <details id="more">
    <summary>Détails pour l'équipe TakaMatch <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></summary>
    <div class="tech" id="tech"><button class="copy" id="copy" type="button">Copier</button><span id="techTxt"></span></div>
  </details>
</main>

<footer>
  Besoin d'aide ? Écris-nous à <a href="mailto:contact@takamatch.com">contact@takamatch.com</a>.<br>L'équipe TakaMatch répond aussi sur
  <a href="https://www.facebook.com/takamatch" target="_blank" rel="noopener">Facebook</a>,
  <a href="https://www.instagram.com/takaamatch" target="_blank" rel="noopener">Instagram</a> et
  <a href="https://www.linkedin.com/company/takamatch" target="_blank" rel="noopener">LinkedIn</a>.
</footer>

<script>
(function(){
  'use strict';
  var I = {
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>',
    retry:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>',
    back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>',
    key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>',
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>'
  };
  var q = new URLSearchParams(location.search);
  /* Paramètres à garder pour revenir à l'inscription (rôle choisi, connexion…). */
  var keep = new URLSearchParams();
  ['mode', 'role'].forEach(function(k){ var v = q.get(k); if(v && /^[a-z]{2,12}$/.test(v)) keep.set(k, v); });
  var onb = '/inscription.html' + (keep.toString() ? '?' + keep.toString() : '');
  /* Adresse de retour : seulement une page de ce site. */
  var back = q.get('retour') || '';
  if(!/^\/[A-Za-z0-9._\-\/?=&%]*$/.test(back) || back.indexOf('//') === 0) back = '';

  var A = {
    home:{l:'Retour à l\'accueil', h:'/', i:'home'},
    email:{l:'Continuer avec mon e-mail', h:onb, i:'mail', main:true},
    login:{l:'Me reconnecter', h:'/inscription.html?mode=login', i:'key', main:true},
    retry:{l:'Réessayer', h:back || null, i:'retry', main:true, retry:true},
    prev:{l:'Page précédente', h:null, i:'back', prev:true}
  };

  /* ---------- Les erreurs connues ---------- */
  var ERRORS = {
    google:{code:'Connexion Google', info:true,
      t:'La connexion avec <em>Google</em> arrive très bientôt',
      p:'Nous finalisons ce raccourci. En attendant, ton adresse e-mail suffit : pas de mot de passe à retenir, tu reçois simplement un code à 6 chiffres.',
      steps:['Entre ton adresse e-mail (Gmail fonctionne très bien).', 'Recopie le code reçu par e-mail.', 'C\'est tout : ton compte est prêt.'],
      acts:['email', 'home'], tech:'GOOGLE_PROVIDER_DISABLED'},
    oauth:{code:'Connexion Google',
      t:'La connexion avec Google n\'a pas abouti',
      p:'Google ne nous a pas renvoyé ton accord, ou la demande a expiré. Rien n\'a été créé : tu peux réessayer, ou utiliser ton adresse e-mail.',
      acts:['email', 'home'], tech:'OAUTH_RETURN_ERROR'},
    404:{code:'Erreur 404',
      t:'Cette page s\'est perdue en chemin',
      p:'L\'adresse est peut-être mal tapée, ou la page a changé de place. Le reste de TakaMatch, lui, est bien là.',
      acts:['home', 'prev'], tech:'404 NOT_FOUND'},
    session:{code:'Session expirée', info:true,
      t:'Ta session a expiré',
      p:'Par sécurité, on te déconnecte au bout d\'un moment. Reconnecte-toi avec ton e-mail : tu retrouves tout là où tu l\'avais laissé.',
      acts:['login', 'home'], tech:'SESSION_EXPIRED'},
    reseau:{code:'Hors connexion',
      t:'Pas de connexion internet',
      p:'Ton appareil ne parvient pas à joindre TakaMatch. Vérifie ton Wi-Fi ou tes données mobiles, puis réessaie : rien de ce que tu as fait n\'est perdu.',
      acts:['retry', 'home'], tech:'NETWORK_UNREACHABLE'},
    serveur:{code:'Erreur 500',
      t:'Un souci de notre côté',
      p:'Ce n\'est pas toi, c\'est nous. Le service a eu un raté ; il repart en général en quelques instants. Réessaie dans une minute.',
      acts:['retry', 'home'], tech:'SERVER_ERROR'},
    maintenance:{code:'Maintenance', info:true,
      t:'On améliore TakaMatch',
      p:'La plateforme fait une courte pause pour une mise à jour. Tes données sont en sécurité ; reviens dans quelques minutes.',
      acts:['retry', 'home'], tech:'MAINTENANCE'},
    acces:{code:'Accès refusé',
      t:'Cette page t\'est fermée',
      p:'Elle est réservée à un autre compte ou à l\'équipe TakaMatch. Si tu penses que c\'est une erreur, écris-nous à contact@takamatch.com.',
      acts:['home', 'prev'], tech:'403 FORBIDDEN'}
  };
  ERRORS.generic = {code:'Erreur', t:'Un petit détour', p:'Quelque chose ne s\'est pas passé comme prévu. Réessaie, ou repars de l\'accueil.', acts:['retry', 'home'], tech:'UNKNOWN'};

  var type = q.get('type') || document.documentElement.getAttribute('data-default') || 'generic';
  var E = ERRORS[type] || ERRORS.generic;
  var $ = function(id){ return document.getElementById(id); };
  /* Espace insécable avant : ; ! ? (typographie française). */
  var fr = function(t){ return String(t).replace(/ ([:;!?])/g, '\u00a0$1'); };

  document.title = 'TakaMatch — ' + E.code;
  $('code').textContent = E.code;
  if(E.info) $('tag').classList.add('info');
  $('t').innerHTML = fr(E.t);            /* textes fixes de ce fichier, jamais de l'adresse */
  $('lead').textContent = fr(E.p);
  if(E.steps){ $('steps').hidden = false; $('steps').innerHTML = E.steps.map(function(s, i){ return '<li><b>' + (i + 1) + '</b><span></span></li>'; }).join('');
    [].forEach.call($('steps').querySelectorAll('span'), function(el, i){ el.textContent = fr(E.steps[i]); }); }

  var acts = $('acts');
  E.acts.forEach(function(k){
    var a = A[k]; if(!a) return;
    if(a.prev && history.length < 2) return;
    var el = document.createElement(a.h ? 'a' : 'button');
    el.className = 'btn ' + (a.main ? 'btn-main' : 'btn-ghost');
    el.innerHTML = I[a.i] + '<span></span>'; el.lastChild.textContent = a.l;
    if(a.h) el.href = a.h; else el.type = 'button';
    if(a.retry && !a.h) el.addEventListener('click', function(){ history.length > 1 ? history.back() : location.assign('/'); });
    if(a.prev) el.addEventListener('click', function(){ history.back(); });
    acts.appendChild(el);
  });
  /* S'il n'y a qu'un bouton secondaire, il devient principal. */
  if(!acts.querySelector('.btn-main') && acts.firstChild) acts.firstChild.className = 'btn btn-main';

  var detail = q.get('detail') || '';
  var tech = 'Code : ' + E.tech + (detail ? ' · ' + detail.slice(0, 160) : '') + '\nPage : ' + location.pathname + '\nDate : ' + new Date().toLocaleString('fr-FR');
  $('techTxt').textContent = tech;
  $('techTxt').style.whiteSpace = 'pre-wrap';
  $('copy').addEventListener('click', function(){
    var b = this, ok = function(){ b.textContent = 'Copié'; setTimeout(function(){ b.textContent = 'Copier'; }, 1600); };
    try{ navigator.clipboard.writeText(tech).then(ok, function(){}); }catch(e){}
  });

  var th = $('theme');
  function paintTheme(){ var d = document.documentElement.getAttribute('data-theme') === 'dark'; th.innerHTML = d ? I.sun : I.moon; th.setAttribute('aria-label', d ? 'Passer en thème clair' : 'Passer en thème sombre'); }
  th.addEventListener('click', function(){ var n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n); try{ localStorage.setItem('tm-theme', n); }catch(e){} paintTheme(); });
  paintTheme();
})();
</script>
</body>
</html>
