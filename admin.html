<style>
:root{
  /* Neutres chauds — DESIGN.md §3 */
  --ground:#F4F1EA; --surface:#FAF9F5; --surface-2:#F2EFE7; --surface-3:#EDE9E0;
  --line:#E4E0D6; --line-strong:#D2CCBC;
  /* Les deux encres secondaires ont été assombries : à #8A8579 le texte
     tertiaire ne donnait que 3,4:1 sur le papier — sous le seuil AA. */
  --ink:#1F1E1B; --ink-2:#5D5A52; --ink-3:#706C5E; --ink-4:#8C8779;

  /* Ombres : réservées aux calques flottants. Les cartes se posent
     sur un filet, pas sur une ombre (DESIGN.md §6). */
  --shadow-1:none;
  --shadow-2:0 1px 2px rgba(31,30,27,.05),0 8px 20px -10px rgba(31,30,27,.14);
  --shadow-3:0 4px 10px -4px rgba(31,30,27,.10),0 22px 48px -16px rgba(31,30,27,.26);
  --shadow-pop:0 10px 30px -10px rgba(31,30,27,.30);

  /* Marque — les deux 500 sont vos hex d'origine, intacts.
     Les paliers voisins sont retendus pour tenir sur le papier. */
  --tal-50:#EAF0F6; --tal-100:#DAE6F1; --tal-200:#BCD3E8; --tal-300:#8DB7DC;
  --tal-500:#007CD8; --tal-600:#0A65AE; --tal-700:#0A5C99; --tal-800:#083F69;
  --vis-50:#F7F1DD; --vis-100:#F2E6BE; --vis-200:#EBD694; --vis-300:#E3C258;
  --vis-500:#FFD741; --vis-600:#C9941A; --vis-700:#8A6008; --vis-800:#5E4106;

  /* Sémantique — DESIGN.md §3, jamais confondue avec l'accent */
  --ok:#4B7F52; --ok-bg:#E8EFE5; --ok-ink:#3A6640;
  /* Encre posée sur un aplat sémantique plein (pastille de compteur). */
  --on-bad:#fff;
  --warn:#B07D2E; --warn-bg:#F5EDDC; --warn-ink:#7D5715;
  --bad:#B54A3F; --bad-bg:#F4E5E1; --bad-ink:#93372E;

  /* Rayons — DESIGN.md §5 : courts et constants, 6 à 10 px.
     Au-delà de 12 px seulement pour les grands calques. */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:12px; --r-2xl:16px; --r-pill:999px;

  /* Espacement — base 8 (DESIGN.md §5) */
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px; --s6:64px; --s7:96px;

  --ease:cubic-bezier(.22,1,.36,1); --ease-in:cubic-bezier(.4,0,1,1);
  --t-fast:.13s; --t:.22s; --t-slow:.38s;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --disp:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  /* Accent par défaut = Talent */
  --a-50:var(--tal-50); --a-100:var(--tal-100); --a-200:var(--tal-200); --a-300:var(--tal-300);
  --a-500:var(--tal-500); --a-600:var(--tal-600); --a-700:var(--tal-700);
  --a-on:#fff;
  --a-edge:var(--tal-600);
  --a-glow:rgba(0,124,216,.18);
  /* Couleur « de l'autre » : un Talent voit ses interlocuteurs en or,
     un Visionnaire les voit en bleu. La conversation garde deux voix. */
  --o-50:var(--vis-50); --o-100:var(--vis-100); --o-700:var(--vis-700);
}
:root[data-role="vis"]{
  --a-50:var(--vis-50); --a-100:var(--vis-100); --a-200:var(--vis-200); --a-300:var(--vis-300);
  --a-500:var(--vis-500); --a-600:var(--vis-500); --a-700:var(--vis-700);
  --a-on:#4A3500;              /* encre sombre sur l'or : 11:1 au lieu de 1,6:1 */
  --a-edge:var(--vis-600);     /* l'or sur papier crème a besoin d'un filet */
  --a-glow:rgba(201,148,26,.22);
  --o-50:var(--tal-50); --o-100:var(--tal-100); --o-700:var(--tal-700);
}

/* Thème sombre : le pendant nocturne du papier, pas un inverse mécanique. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#1A1815; --surface:#22201C; --surface-2:#282521; --surface-3:#302C27;
    --line:#37332D; --line-strong:#4A453D;
    --ink:#F2EFE8; --ink-2:#BDB7AC; --ink-3:#A49E92; --ink-4:#8B857A;
    --shadow-2:0 1px 2px rgba(0,0,0,.4),0 8px 20px -10px rgba(0,0,0,.6);
    --shadow-3:0 4px 10px -4px rgba(0,0,0,.45),0 22px 48px -16px rgba(0,0,0,.7);
    --shadow-pop:0 10px 30px -10px rgba(0,0,0,.65);
    --tal-50:#14252F; --tal-100:#1A3244; --tal-200:#25475F; --tal-300:#3A6E92;
    --tal-500:#3FA3EE; --tal-600:#5CB4F5; --tal-700:#9CD1FA;
    --vis-50:#2A2308; --vis-100:#3B300C; --vis-200:#514111; --vis-300:#735C17;
    --vis-500:#FFD741; --vis-600:#FFD741; --vis-700:#F0CE6F;
    --ok:#7FA886; --ok-bg:#1C2A1E; --ok-ink:#9DC2A3;
    --warn:#D2A44E; --warn-bg:#2C2312; --warn-ink:#E0BC77;
    --bad:#D4796D; --bad-bg:#2E1B18; --bad-ink:#E5A196; --on-bad:#2E1512;
    --a-on:#08283F;
    --a-edge:var(--tal-600);
  }
  :root:not([data-theme="light"])[data-role="vis"]{ --a-on:#2A2308; --a-edge:var(--vis-300); }
}
:root[data-theme="dark"]{
  --ground:#1A1815; --surface:#22201C; --surface-2:#282521; --surface-3:#302C27;
  --line:#37332D; --line-strong:#4A453D;
  --ink:#F2EFE8; --ink-2:#BDB7AC; --ink-3:#A49E92; --ink-4:#8B857A;
  --shadow-2:0 1px 2px rgba(0,0,0,.4),0 8px 20px -10px rgba(0,0,0,.6);
  --shadow-3:0 4px 10px -4px rgba(0,0,0,.45),0 22px 48px -16px rgba(0,0,0,.7);
  --shadow-pop:0 10px 30px -10px rgba(0,0,0,.65);
  --tal-50:#14252F; --tal-100:#1A3244; --tal-200:#25475F; --tal-300:#3A6E92;
  --tal-500:#3FA3EE; --tal-600:#5CB4F5; --tal-700:#9CD1FA;
  --vis-50:#2A2308; --vis-100:#3B300C; --vis-200:#514111; --vis-300:#735C17;
  --vis-500:#FFD741; --vis-600:#FFD741; --vis-700:#F0CE6F;
  --ok:#7FA886; --ok-bg:#1C2A1E; --ok-ink:#9DC2A3;
  --warn:#D2A44E; --warn-bg:#2C2312; --warn-ink:#E0BC77;
  --bad:#D4796D; --bad-bg:#2E1B18; --bad-ink:#E5A196; --on-bad:#2E1512;
  --a-on:#08283F;
  --a-edge:var(--tal-600);
}
:root[data-theme="dark"][data-role="vis"]{ --a-on:#2A2308; --a-edge:var(--vis-300); }

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--tal-600)}
h1,h2,h3{font-family:var(--disp);font-weight:600;margin:0;letter-spacing:-.005em}
[hidden]{display:none!important}
.ic{width:18px;height:18px;flex:0 0 auto}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--tal-500);outline-offset:2px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:var(--r-md);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background var(--t-fast),border-color var(--t-fast),filter var(--t-fast)}
.btn .ic{width:16px;height:16px}
.btn-sm{height:32px;padding:0 11px;font-size:12.5px}
.btn-a{background:var(--tal-600);color:#fff}
.btn-a:hover{filter:brightness(1.07)}
.btn-ghost{border:1px solid var(--line-strong);background:var(--surface)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-quiet{color:var(--ink-2)}
.btn-quiet:hover{background:var(--surface-3)}
.btn-ok{background:var(--ok);color:#fff}
.btn-warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.btn-bad{background:var(--bad);color:#fff}
.btn-bad-ghost{border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad-ink);background:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-block{width:100%}
.iconbtn{width:36px;height:36px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}
.lnk{color:var(--tal-600);font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* Champs */
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.inp{height:40px;border:1px solid var(--line);background:var(--surface-3);border-radius:var(--r-md);padding:0 12px;width:100%;outline:none;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--tal-500);box-shadow:0 0 0 3px rgba(0,124,216,.15);background:var(--surface)}
select.inp{padding-right:28px}
.hint{font-size:12.5px;color:var(--ink-3)}
.err{font-size:13px;color:var(--bad-ink);background:var(--bad-bg);padding:9px 12px;border-radius:var(--r-md)}
.check{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:var(--r-md);cursor:pointer}
.check:hover{background:var(--surface-2)}
.check input{width:17px;height:17px;margin-top:2px;accent-color:var(--ok)}

/* Jetons */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.chip .ic{width:12px;height:12px}
.c-ok{background:var(--ok-bg);color:var(--ok-ink)}
.c-warn{background:var(--warn-bg);color:var(--warn-ink)}
.c-bad{background:var(--bad-bg);color:var(--bad-ink)}
.c-tal{background:var(--tal-50);color:var(--tal-700)}
.c-vis{background:var(--vis-50);color:var(--vis-700)}
.c-ink{background:var(--ink);color:var(--ground)}
.handle{font-family:var(--mono);font-size:12px;background:#15130F;color:#fff;padding:2px 7px;border-radius:var(--r-sm)}
.vbadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;white-space:nowrap}
.vbadge svg{width:15px;height:15px}
.vb-tal svg{fill:#007CD8}.vb-tal span{color:var(--tal-700)}
.vb-vis svg{fill:#E2A70F}.vb-vis span{color:var(--vis-700)}
.vb-off svg{fill:#D3CEC3}.vb-off span{color:var(--ink-3);font-weight:500}
:root[data-theme="dark"] .vb-tal svg{fill:#3FA3EE}:root[data-theme="dark"] .vb-vis svg{fill:#FFD741}:root[data-theme="dark"] .vb-off svg{fill:#4F4A42}
:root[data-theme="dark"] .handle{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}

/* Cartes et grilles */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl)}
.card-pad{padding:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-split{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-t h3{font-size:17px}
.kpi .k{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.kpi .k .ic{width:15px;height:15px}
.kpi .v{font-family:var(--disp);font-size:30px;font-weight:600;line-height:1.15;margin-top:6px}
.kpi .d{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.kpi .d.up{color:var(--ok-ink)}
.todo{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.todo:hover{border-color:var(--line-strong);background:var(--surface-2)}
.todo .n{font-family:var(--disp);font-size:24px;font-weight:600;min-width:34px}
.todo.hot .n{color:var(--bad-ink)}

/* Coquille */
.demo-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-bottom:16px;border-radius:12px;background:var(--warn-bg,#F6EDD3);color:var(--warn-ink,#7A5A12);font-size:13.5px;line-height:1.5}
.demo-note svg{flex:0 0 auto;margin-top:1px}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.login::before,.login::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);z-index:0}
.login::before{width:520px;height:520px;background:var(--vis-500);opacity:.35;left:-160px;top:-120px}
.login::after{width:560px;height:560px;background:var(--tal-500);opacity:.25;right:-180px;bottom:-160px}
.login-c{position:relative;z-index:1;width:min(420px,100%);padding:30px 28px}
.login-c .logo{height:38px;margin:0 auto 22px;display:block}
.login-c{text-align:center}
.login-c .field{align-items:center}
.login-c .field .inp{text-align:center}
.login-c .demo-acc .lbl,.login-c .demo-acc .hint{text-align:center}
.demo-acc{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.demo-acc button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:var(--r-sm);font-size:12.5px;text-align:left}
.demo-acc button:hover{background:var(--surface-2)}
.top{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .logo{height:28px}
.staff-chip{font-size:11.5px;font-weight:700;color:var(--ground);background:var(--ink);padding:3px 8px;border-radius:var(--r-sm);letter-spacing:.01em}
.gsearch{position:relative;width:min(380px,40vw)}
.gsearch .inp{height:36px;padding-left:34px}
.gsearch .ic{position:absolute;left:10px;top:9px;color:var(--ink-3)}
.gres{position:absolute;top:42px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-3);padding:6px;z-index:30;max-height:360px;overflow:auto}
.gres button{display:flex;width:100%;gap:10px;align-items:center;padding:8px;border-radius:var(--r-md);text-align:left}
.gres button:hover,.gres button.on{background:var(--surface-2)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(75,127,82,.5)}
.live.pulse i{animation:pulse 1.2s 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(75,127,82,.6)}100%{box-shadow:0 0 0 10px rgba(75,127,82,0)}}
.me-btn{display:flex;align-items:center;gap:9px;padding:4px 8px 4px 4px;border-radius:var(--r-pill);border:1px solid var(--line)}
.me-btn:hover{background:var(--surface-2)}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100% - 60px)}
.side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;background:var(--ground);position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.side .grp{font-size:11.5px;font-weight:700;color:var(--ink-4);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);color:var(--ink-2);font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--surface-3);color:var(--ink)}
.nav.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.nav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.nav .cnt.soft{background:var(--surface-3);color:var(--ink-2)}
.side .foot{margin-top:auto;padding:12px 10px 4px;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.main{padding:24px 28px 60px;min-width:0}
.wrap{max-width:1240px;margin:0 auto}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h h1{font-size:28px;line-height:1.2}
.page-h p{color:var(--ink-2);margin:4px 0 0}
.page-h .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{padding:9px 12px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tabs .n{font-size:11px;background:var(--surface-3);border-radius:99px;padding:1px 7px;color:var(--ink-2)}

<style id="tmg-css">

<script>
(function(){
  'use strict';
  var booted = false, failed = false, bar = null, errors = [];
  var G = window.TMGuard = {errors: errors, onError: null};

  function dark(){
    var t = document.documentElement.getAttribute('data-theme');
    if(!t){ try{ t = localStorage.getItem('tm-theme'); }catch(e){} }
    if(t === 'dark' || t === 'light') return t === 'dark';
    return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function boot(){ return document.getElementById('tmgBoot'); }

  /* Erreurs sans intérêt pour l'utilisateur. */
  function noise(msg){ return /ResizeObserver loop|^Script error\.?$/i.test(String(msg || '')); }

  function record(err, where){
    var e = {at: Date.now(), where: where || 'page', message: String((err && err.message) || err), stack: err && err.stack ? String(err.stack).slice(0, 2000) : ''};
    errors.push(e); if(errors.length > 20) errors.shift();
    try{ console.error('[TakaMatch]', where || '', err); }catch(_){}
    try{ if(typeof G.onError === 'function') G.onError(e); }catch(_){}
    return e;
  }

  /* Panneau « ça n'a pas marché » : remplace un écran blanc. */
  G.panel = function(err, title, text, actions){
    var e = err ? (err.message || String(err)) : '';
    return '<div class="tmg-in" role="alert"><h2>'+esc(title || 'Cette page n\'a pas pu s\'afficher')+'</h2>'
      + '<p>'+esc(text || 'Un problème technique nous empêche d\'afficher la page. Tes données ne sont pas perdues.')+'</p>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'+(actions || '')
      + '<button class="tmg-btn" type="button" onclick="location.reload()">Recharger la page</button></div>'
      + (e ? '<details><summary>Détail technique</summary><pre>'+esc(e)+'</pre></details>' : '')+'</div>';
  };

  function showBar(msg, offline){
    if(!document.body) return;
    if(!bar){
      bar = document.createElement('div'); bar.className = 'tmg-bar'; bar.setAttribute('role', 'alert');
      bar.innerHTML = '<span></span><button class="tmg-btn" type="button">Recharger</button><button class="x" type="button" aria-label="Fermer">×</button>';
      bar.querySelector('.tmg-btn').onclick = function(){ location.reload(); };
      bar.querySelector('.x').onclick = function(){ bar.hidden = true; };
      document.body.appendChild(bar);
    }
    bar.classList.toggle('off', !!offline);
    bar.querySelector('span').textContent = msg;
    bar.hidden = false;
  }
  G.notify = function(msg){ showBar(msg, false); };
  /* Note une erreur déjà gérée par la page (sans afficher de bandeau). */
  G.log = function(err, where){ return record(err, where); };

  /* Une erreur avant la fin du chargement → panneau plein écran.
     Une erreur après → bandeau discret, la page reste utilisable. */
  G.crash = function(err, where){
    if(noise(err && err.message || err)) return;
    record(err, where);
    var b = boot();
    if(!booted && b){
      failed = true;
      b.hidden = false; b.className = 'tmg-boot err' + (dark() ? ' dark' : '');
      b.innerHTML = G.panel(err);
    } else {
      showBar('Oups, quelque chose n\'a pas marché. Ta dernière action n\'a peut-être pas été prise en compte.');
    }
  };
  window.addEventListener('error', function(ev){
    if(ev && ev.target && ev.target !== window) return;   /* image ou fichier manquant : géré localement */
    G.crash(ev.error || ev.message, 'erreur');
  });
  window.addEventListener('unhandledrejection', function(ev){ G.crash(ev.reason || 'Promesse rejetée', 'promesse'); });

  /* Fin du chargement : on retire l'écran d'attente, sauf si la page a planté. */
  G.ready = function(){
    if(booted) return; booted = true;
    var b = boot(); if(b && !failed) b.remove();
  };
  document.addEventListener('DOMContentLoaded', function(){
    var b = boot(); if(b && dark()) b.classList.add('dark');
    if(!window.TMG_MANUAL) setTimeout(G.ready, 0);   /* la coquille, elle, attend que la vitrine soit prête */
  });
  /* Filet : si rien ne s'affiche au bout de 15 s, on le dit. */
  setTimeout(function(){
    var b = boot();
    if(!booted && b && !failed){ b.classList.add('err'); b.innerHTML = G.panel(null, 'C\'est plus long que prévu', 'La page met du temps à se charger. Vérifie ta connexion, puis recharge.'); }
  }, 15000);

  /* Hors connexion : bandeau, sauf si la page a déjà le sien (#offline). */
  function syncNet(){
    if(document.getElementById('offline')) return;
    if(navigator.onLine === false) showBar('Tu es hors connexion. Ce que tu fais maintenant ne sera envoyé qu\'au retour du réseau.', true);
    else if(bar && bar.classList.contains('off')) bar.hidden = true;
  }
  window.addEventListener('online', syncNet); window.addEventListener('offline', syncNet);
  document.addEventListener('DOMContentLoaded', syncNet);

  /* ---------- Requêtes réseau robustes ----------
     TMGuard.fetch(url, options, {timeout, retries})
     → renvoie le JSON, ou lève une Error avec un message lisible
       (err.kind : 'offline' | 'timeout' | 'network' | 'http', err.status).
     Les nouvelles tentatives ne concernent que les pannes (réseau, 408,
     429, 5xx) — jamais un refus du serveur (400, 401, 409…). */
  function mk(kind, message, status, data){ var e = new Error(message); e.kind = kind; e.status = status || 0; e.data = data; return e; }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  var HTTP_MSG = {401:'Ta session a expiré. Reconnecte-toi.', 403:'Tu n\'as pas accès à cette action.', 404:'Élément introuvable.',
    408:'Le serveur met trop de temps à répondre.', 429:'Trop de demandes d\'un coup. Patiente quelques secondes.'};
  G.fetch = async function(url, opts, cfg){
    cfg = cfg || {}; var timeout = cfg.timeout || 15000, retries = cfg.retries || 0, last;
    for(var attempt = 0; ; attempt++){
      if(navigator.onLine === false){
        last = mk('offline', 'Pas de connexion internet. Vérifie ton réseau puis réessaie.');
      } else {
        var ctl = window.AbortController ? new AbortController() : null, tm = ctl ? setTimeout(function(){ ctl.abort(); }, timeout) : 0, r, data;
        try{
          r = await fetch(url, Object.assign({}, opts || {}, ctl ? {signal: ctl.signal} : {}));
          data = await r.json().catch(function(){ return {}; });
        }catch(e){
          last = e && e.name === 'AbortError'
            ? mk('timeout', 'Le serveur met trop de temps à répondre. Réessaie dans un instant.')
            : mk('network', 'Impossible de joindre le serveur. Vérifie ta connexion puis réessaie.');
        }finally{ clearTimeout(tm); }
        if(r){
          if(r.ok) return data;
          last = mk('http', (data && data.error) || HTTP_MSG[r.status] || (r.status >= 500 ? 'Le service est momentanément indisponible. Réessaie dans un instant.' : 'La demande a été refusée.'), r.status, data);
          if(!(r.status >= 500 || r.status === 408 || r.status === 429)) throw last;
        }
      }
      if(attempt >= retries) throw last;
      await sleep(Math.min(8000, 700 * Math.pow(2, attempt)) + Math.random() * 300);
    }
  };

  /* Petit identifiant unique (clés d'idempotence…). */
  G.uid = function(){
    try{ if(crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  };
})();
</script>

djara Market","owner":"Estelle Quenum","ownerHandle":"panier_direct","ownerCity":"Porto-Novo, Bénin","ownerVerified":true,"sectors":["artisanat","ecommerce"],"seeking":["growth","dev-front","contenu"],"hue":340,"likes":19,"pay":"mixte","hook":"Une vannière d'Adjara vend un panier 1 500 FCFA au marché. Le même panier part à 34 € dans une boutique parisienne. Adjara Market met les artisans en vente directe auprès de la diaspora, avec paiement en euros et expédition groupée.","sex":"f"},{"id":"TM-VIS-8807","title":"Solar Box","owner":"Wilfried Hounsou","ownerHandle":"sans_lampant","ownerCity":"Djougou, Bénin","ownerVerified":false,"sectors":["greentech","impact","fintech"],"seeking":["finance","terrain","dev-back"],"hue":50,"likes":29,"pay":"equity","hook":"Un ménage rural béninois dépense 4 500 FCFA par mois en pétrole lampant et en recharge de téléphone. Un kit solaire coûte 85 000 FCFA — inaccessible d'un coup, évident à 3 500 FCFA par mois. Solar Box fait le pont par paiement échelonné verrouillé à distance.","sex":"m"},{"id":"TM-VIS-1156","title":"Doko Data","owner":"Armand Gnonlonfoun","ownerHandle":"parcelle_onze","ownerCity":"Cotonou, Bénin","ownerVerified":true,"sectors":["agritech","saas"],"seeking":["data","vente","produit"],"hue":175,"likes":26,"pay":"equity","hook":"Les assureurs agricoles ouest-africains refusent d'assurer les petits producteurs parce qu'ils ne savent pas mesurer une perte de récolte à distance. Doko Data transforme l'imagerie Sentinel-2 en indice de rendement parcelle par parcelle.","sex":"n"},{"id":"TM-VIS-5528","title":"Vodun Studio","owner":"Marielle Ahouansou","ownerHandle":"sept_minutes","ownerCity":"Ouidah, Bénin","ownerVerified":true,"sectors":["medias","artisanat"],"seeking":["contenu","brand","finance"],"hue":288,"likes":41,"pay":"mixte","hook":"Les enfants béninois grandissent avec des dessins animés japonais et américains. Vodun Studio adapte les contes du panthéon vodun en séries animées de 7 minutes, en français et en fon.", /* ---------- Connexion : e-mail + code à 6 chiffres (Supabase) ----------
   Pas de mot de passe. Seules les adresses ajoutées par un super admin
   (Équipe et accès) entrent ; elles reçoivent leur rôle à la première connexion. */
let L = {step:'mail', email:'', busy:false, err:''};
function renderLogin(){
  const mail = L.step === 'mail';
  $('#root').innerHTML = '<div class="login"><form class="card login-c" id="loginF" autocomplete="off" novalidate>'
    + '<img class="logo" src="'+LOGO_SRC+'" alt="TakaMatch">'
    + '<h1 style="font-size:26px;margin-bottom:4px">Espace équipe</h1>'
    + '<p style="color:var(--ink-2);margin:0 0 18px">'+(mail ? 'Accès réservé à l\'équipe TakaMatch. Chaque connexion est inscrite au journal.' : 'Code envoyé à <b>'+esc(L.email)+'</b>. Regarde aussi dans les indésirables.')+'</p>'
    + '<div class="col">'
    + (mail
        ? '<div class="field"><label for="lgE">Adresse e-mail</label><input class="inp" id="lgE" type="email" placeholder="ton@email.com" autocomplete="username" value="'+esc(L.email)+'"></div>'
        : '<div class="field"><label for="lgC">Code reçu par e-mail</label><input class="inp mono" id="lgC" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" style="letter-spacing:.35em;font-size:20px"></div>')
    + '<div id="lgErr">'+(L.err ? '<div class="err">'+esc(L.err)+'</div>' : '')+'</div>'
    + '<button class="btn btn-a btn-block" type="submit" style="height:42px"'+(L.busy ? ' disabled' : '')+'>'+ic('lock')+(L.busy ? 'Un instant…' : mail ? 'Recevoir un code' : 'Se connecter')+'</button>'
    + (mail ? '' : '<div class="row" style="justify-content:center;gap:14px;margin-top:4px"><button type="button" class="btn btn-quiet btn-sm" data-act="lg-back">Changer d\'adresse</button><button type="button" class="btn btn-quiet btn-sm" data-act="lg-resend">Renvoyer le code</button></div>')
    + '</div><p class="hint" style="margin-top:14px">Pas de mot de passe : un code à usage unique t\'est envoyé à chaque connexion. Tu peux te connecter depuis n\'importe quel ordinateur ou téléphone.</p></form></div>';
  const f = $(mail ? '#lgE' : '#lgC'); if(f) setTimeout(() => f.focus(), 30);
}
function lgFail(e){ L.busy = false; L.err = (e && e.message) || 'La demande n\'a pas abouti.'; renderLogin(); }
async function doLogin(){
  if(L.busy) return;
  if(L.step === 'mail'){
    const em = ($('#lgE').value || '').trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){ L.err = 'Entre une adresse e-mail valide.'; L.email = em; return renderLogin(); }
    L.email = em; L.busy = true; L.err = ''; renderLogin();
    try{ await TMDB.sendCode(em, true); L.step = 'code'; L.busy = false; renderLogin(); }catch(e){ lgFail(e); }
    return;
  }
  const code = ($('#lgC').value || '').replace(/\D/g, '');
  if(code.length !== 6){ L.err = 'Le code compte 6 chiffres.'; return renderLogin(); }
  L.busy = true; L.err = ''; renderLogin();
  try{ await TMDB.verifyCode(L.email, code); await enter(); }catch(e){ lgFail(e); }
}
/* Session ouverte : on vérifie le rôle dans la base (jamais dans le navigateur). */
async function enter(){
  let role = null;
  try{ role = await TMDB.rpc('staff_claim'); }catch(e){ role = null; }
  if(!role || !ROLES[role]){
    try{ await TMDB.signOut(); }catch(e){}
    L = {step:'mail', email:L.email, busy:false, err:'Cette adresse n\'a pas accès à l\'espace équipe. Demande à un super admin de t\'ajouter dans « Équipe et accès ».'};
    A.me = null; return renderLogin();
  }
  const em = TMDB.email(); let name = em.split('@')[0];
  try{ const rows = await TMDB.rpc('staff_members'); A.staffRows = rows; const me = (rows || []).find(r => r.is_me); if(me && me.name) name = me.name; }catch(e){}
  A.me = {id:TMDB.uid(), name, email:em, role, status:'active'};
  A.view = 'overview'; L = {step:'mail', email:'', busy:false, err:''};
  TMDB.rpc('admin_note', {p_action:'Connexion', p_detail:'Espace équipe'}).catch(() => {});
  render(); toast('Bonjour '+name.split(' ')[0]+'.');
}
function logout(){
  TMDB.rpc('admin_note', {p_action:'Déconnexion', p_detail:'Espace équipe'}).catch(() => {}).then(() => TMDB.signOut());
  A.me = null; A.drawer = null; A.modal = null; A.staffRows = null; A.logRows = null; A.pricing = null; render();
}

function decideVerif(v, status, motif, more){
  const u = userBy(v.uid);
  v.status = status; v.decidedAt = Date.now(); v.decidedBy = staffName(); v.motif = motif || '';
  if(status === 'approved'){ u.verifiedId = true; v.history.push({at:Date.now(), by:staffName(), t:'Validé'}); }
  if(status === 'rejected'){ v.history.push({at:Date.now(), by:staffName(), t:'Refusé · '+motif}); }
  if(status === 'more'){ v.decidedAt = null; v.history.push({at:Date.now(), by:staffName(), t:'Complément demandé : '+motif}); }
  log(status === 'approved' ? 'Profil vérifié' : status === 'rejected' ? 'Vérification refusée' : 'Complément demandé', '@'+u.handle, v.id+(motif ? ' · '+motif : ''));
  bus('verify-decision', {email:u.email, handle:u.handle, ok:status === 'approved', more:!!more, motif});

}

function userAction(kind, u, motif, extra){
  if(kind === 'warn'){ log('Avertissement envoyé', '@'+u.handle, motif); bus('warning', {email:u.email, handle:u.handle, text:motif}); u.notes.unshift({at:Date.now(), by:staffName(), t:'Avertissement : '+motif}); toast('Avertissement envoyé à @'+u.handle+'.'); }
  if(kind === 'offline'){ u.online = !u.online; log(u.online ? 'Fiche remise en ligne' : 'Fiche mise hors ligne', '@'+u.handle, motif); toast(u.online ? 'Fiche remise en ligne.' : 'Fiche mise hors ligne.'); }
  if(kind === 'suspend'){ u.status = 'suspended'; u.suspendedUntil = Date.now() + extra*DAY; u.notes.unshift({at:Date.now(), by:staffName(), t:'Suspendu '+extra+' jours : '+motif}); log('Compte suspendu ('+extra+' jours)', '@'+u.handle, motif); bus('account-status', {email:u.email, handle:u.handle, status:'suspended', motif}); toast('@'+u.handle+' est suspendu '+extra+' jours.'); }
  if(kind === 'ban'){ u.status = 'banned'; u.online = false; u.notes.unshift({at:Date.now(), by:staffName(), t:'Banni : '+motif}); log('Compte banni', '@'+u.handle, motif); bus('account-status', {email:u.email, handle:u.handle, status:'banned', motif}); toast('@'+u.handle+' est banni.', 'bad'); }
  if(kind === 'restore'){ u.status = 'active'; delete u.suspendedUntil; u.notes.unshift({at:Date.now(), by:staffName(), t:'Réactivé : '+motif}); log('Compte réactivé', '@'+u.handle, motif); toast('Compte réactivé.'); }
  if(kind === 'unverify'){ u.verifiedId = false; log('Badge retiré', '@'+u.handle, motif); toast('Badge retiré.'); }
  if(kind === 'credits'){ u.credits = Math.max(0, u.credits + extra); D.payments.unshift({id:'PAY-'+uid().toUpperCase(), at:Date.now(), uid:u.id, label:(extra > 0 ? 'Crédits offerts · ' : 'Crédits retirés · ')+Math.abs(extra), amount:0, kind:'gift', op:'—', status:'ok', ref:'Équipe'});
    log('Crédits ajustés ('+(extra > 0 ? '+' : '')+extra+')', '@'+u.handle, motif); toast('Crédits mis à jour : '+u.credits+'.'); }
  save(); A.modal = null; render();
}

function decideReport(r, d){
  const note = (($('#repNote') || {}).value || '').trim();
  if(!note){ const n = $('#repNote'); if(n){ n.style.borderColor = 'var(--bad)'; n.focus(); } return toast('Ajoute une note interne pour justifier la décision.', 'bad'); }
  const u = userByHandle(r.target);
  const L = {close:'Classé sans suite', warn:'Avertissement envoyé', hide:'Contenu masqué', suspend:'Compte suspendu 7 jours', ban:'Compte banni'};
  r.status = 'done'; r.decision = L[d]; r.decidedBy = staffName(); r.decidedAt = Date.now(); r.note = note;
  log('Signalement traité · '+L[d], r.id+' · @'+r.target, note);
  if(u && d === 'warn') userAction('warn', u, 'Suite au signalement '+r.id+' : '+note);
  else if(u && d === 'suspend') userAction('suspend', u, 'Signalement '+r.id+' : '+note, 7);
  else if(u && d === 'ban') userAction('ban', u, 'Signalement '+r.id+' : '+note);
  else if(u && d === 'hide'){ u.online = false; save(); }

/* ---------- Prix et taux (base Supabase) ----------
   Les prix se règlent en FCFA. Pour chaque pays, ils sont convertis dans
   la devise locale et arrondis (js/prix.js) : site, outil et serveur de
   paiement lisent ces mêmes valeurs. */
async function loadPrix(){
  try{
    const [pr, fx] = await Promise.all([TMDB.select('pricing', 'select=key,label,fcfa,credits,sort,updated_at&order=sort'), TMDB.select('fx_rates', 'select=currency,name,symbol,fcfa_per_unit,step,sort,updated_at&order=sort')]);
    A.pricing = {pr:pr || [], fx:fx || []};
  }catch(e){ A.pricing = {pr:[], fx:[]}; toast(e.message, 'bad'); }
  if(A.view === 'settings') render();
}
function prixDraft(){
  const prices = {}, fx = {};
  A.pricing.pr.forEach(r => { const i = $('[data-pr="'+r.key+'"]'); prices[r.key] = {label:r.label, credits:r.credits, fcfa:i ? Math.max(0, Math.round(+i.value || 0)) : r.fcfa}; });
  A.pricing.fx.forEach(r => { const a = $('[data-fx="'+r.currency+'"]'), b = $('[data-fxs="'+r.currency+'"]');
    fx[r.currency] = {name:r.name, symbol:r.symbol, r:a ? (+a.value || Number(r.fcfa_per_unit)) : Number(r.fcfa_per_unit), step:b ? (+b.value || Number(r.step)) : Number(r.step)}; });
  return {prices, fx};
}
const CC_OF_CUR = cur => Object.keys(TMPrix.CUR_OF).filter(c => TMPrix.CUR_OF[c] === cur);
function prixPreview(){
  if(!A.pricing) return;
  const d = prixDraft(), keys = A.pricing.pr.map(r => r.key);
  A.pricing.fx.forEach(r => { const el = $('[data-prev="'+r.currency+'"]'); if(!el) return; const cc = CC_OF_CUR(r.currency)[0] || 'BJ';
    el.innerHTML = keys.map(k => { const c = TMPrix.calc(k, cc, d); return '<span class="mono" title="'+esc(c.label)+' · débité '+esc(c.chargedText)+'">'+esc(c.text)+'</span>'; }).join(' · '); });
}
function prixSection(){
  if(!A.pricing){ loadPrix(); return '<section class="card card-pad"><h3 style="font-size:17px">Prix et taux</h3><p class="hint">Chargement…</p></section>'; }
  const sup = A.me.role === 'super', dis = sup ? '' : ' disabled', geo = window.TMGeo ? TMGeo.COUNTRIES : [];
  const countriesOf = cur => CC_OF_CUR(cur).map(c => (geo.find(g => g.id === c) || {n:c}).n).join(', ');
  return '<section class="card card-pad"><div class="row" style="align-items:flex-start;gap:12px;margin-bottom:12px"><div class="grow"><h3 style="font-size:17px;margin-bottom:4px">Prix de référence (FCFA)</h3>'
    + '<p class="hint" style="margin:0">Le prix que paient les pays du FCFA. Pour les autres pays, il est converti avec les taux ci-dessous puis arrondi. Le paiement est toujours encaissé en FCFA.</p></div>'
    + (sup ? '<button class="btn btn-a" data-act="save-prix">'+ic('check')+'Enregistrer les prix et taux</button>' : '<span class="chip">Lecture seule · super admin</span>')+'</div>'
    + '<div class="grid g3">'+A.pricing.pr.map(r => '<div class="field"><label for="pr_'+r.key+'">'+esc(r.label)+'</label><div class="row"><input class="inp mono" id="pr_'+r.key+'" data-pr="'+r.key+'" type="number" min="0" step="50" value="'+r.fcfa+'"'+dis+'><span class="hint">FCFA</span></div></div>').join('')+'</div></section>'
    + '<section class="card card-pad" style="margin-top:14px"><h3 style="font-size:17px;margin-bottom:4px">Taux de conversion</h3>'
    + '<p class="hint" style="margin:0 0 12px">« 1 unité = … FCFA » et le pas d\'arrondi des prix affichés (ex. 1 € → prix ronds en euros ; 10 DH → prix en dizaines de dirhams). L\'aperçu se met à jour pendant que tu tapes.</p>'
    + '<div class="tbl-w"><table><thead><tr><th>Devise</th><th>Pays</th><th>1 unité = … FCFA</th><th>Arrondi</th><th>Aperçu des prix ('+A.pricing.pr.map(r => esc(r.label.split(' · ')[0])).join(' · ')+')</th></tr></thead><tbody>'
    + A.pricing.fx.map(r => { const fixed = r.currency === 'XOF' || r.currency === 'XAF';
        return '<tr><td><b>'+esc(r.name)+'</b><br><span class="hint mono">'+esc(r.currency)+' · '+esc(r.symbol)+'</span></td><td style="font-size:12.5px;color:var(--ink-2);max-width:220px">'+esc(countriesOf(r.currency))+'</td>'
          + '<td><input class="inp mono" style="width:120px" data-fx="'+r.currency+'" type="number" min="0" step="any" value="'+Number(r.fcfa_per_unit)+'"'+(fixed ? ' disabled title="Le FCFA est la devise de référence"' : dis)+'></td>'
          + '<td><input class="inp mono" style="width:100px" data-fxs="'+r.currency+'" type="number" min="0" step="any" value="'+Number(r.step)+'"'+(fixed ? ' disabled' : dis)+'></td>'
          + '<td data-prev="'+r.currency+'" style="font-size:12.5px"></td></tr>'; }).join('')
    + '</tbody></table></div></section>';
}
async function savePrix(){
  if(A.me.role !== 'super') return toast('Réservé au super admin.', 'bad');
  const d = prixDraft(), jobs = [];
  A.pricing.pr.forEach(r => { const v = d.prices[r.key].fcfa; if(v !== r.fcfa) jobs.push(TMDB.update('pricing', 'key=eq.'+r.key, {fcfa:v})); });
  A.pricing.fx.forEach(r => { const x = d.fx[r.currency]; if(x.r !== Number(r.fcfa_per_unit) || x.step !== Number(r.step)) jobs.push(TMDB.update('fx_rates', 'currency=eq.'+r.currency, {fcfa_per_unit:x.r, step:x.step})); });
  if(!jobs.length) return toast('Aucun changement.');
  try{ const res = await Promise.all(jobs);
    if(res.some(x => !x || !x.length)) throw new Error('La base a refusé la modification : vérifie que ton compte est bien super admin.');
    A.pricing = null; A.logRows = null; if(window.TMPrix) TMPrix.refresh(); render(); toast(jobs.length+' modification'+(jobs.length > 1 ? 's enregistrées' : ' enregistrée')+'. Le site affiche déjà les nouveaux prix.');
  }catch(e){ toast(e.message, 'bad'); }
}

    case 'tbl-more': { const more = A.more || (A.more = {}); more[t.dataset.k] = (more[t.dataset.k] || TBL_PAGE) + TBL_PAGE; rerender(); break; }
    /* Paiements */
    case 'refund': if((D.payments.find(x => x.id === id) || {}).status !== 'ok'){ toast('Ce paiement a déjà été remboursé.', 'bad'); render(); break; } motifModal('Rembourser '+id, 'Le remboursement part, via FedaPay, sur le même moyen de paiement (numéro mobile money ou carte). Les crédits ou l\'accès achetés sont retirés.', 'refund-go', id, {reasons:['Double débit', 'Service non rendu', 'Geste commercial', 'Erreur de produit', 'Autre'], ok:'Rembourser', danger:true}); break;
    case 'refund-go': { const p = D.payments.find(x => x.id === id), m = motifVal();
      /* Anti double remboursement (double clic, deux onglets ouverts). */
      if(!p || p.status !== 'ok' || A.refunding === id){ closeModal(); render(); toast('Ce paiement a déjà été remboursé.', 'bad'); break; }
      A.refunding = id; setTimeout(() => { if(A.refunding === id) A.refunding = null; }, 3000);
      p.status = 'refunded'; p.refund = {by:staffName(), at:Date.now(), motif:m}; log('Remboursement', '@'+(userBy(p.uid) || {}).handle, p.id+' · '+fcfa(p.amount)+' · '+m); save(); closeModal(); render(); toast('Remboursement de '+fcfa(p.amount)+' lancé.'); break; }
    case 'give-credits': A.pending = 'credits'; motifModal('Ajouter des crédits', 'Geste commercial ou correction. Inscrit au journal et visible dans les paiements.', 'give-go', '', {user:true, num:'Crédits', reasons:['Geste commercial', 'Correction d\'un incident', 'Partenariat', 'Autre'], ok:'Ajouter'}); break;
    case 'give-go': { const u = userBy($('#mU').value); userAction('credits', u, motifVal(), +$('#mN').value); break; }
    case 'export-pay': download('takamatch-paiements.csv', csv([['Date','Réf.','Utilisateur','Produit','Montant','Moyen','Pays','Prestataire','Statut']].concat(D.payments.map(p => [fmt(p.at), p.ref, '@'+((userBy(p.uid) || {}).handle || ''), p.label, p.amount, p.op, p.cc || '', p.provider || '', p.status])))); log('Export des paiements (CSV)', D.payments.length+' transactions', ''); break;
    /* Support */
    case 'ticket': A.ticket = id; { const x = D.tickets.find(k => k.id === id); if(x) x.live = false; } render(); break;
    case 't-reply': { const x = D.tickets.find(k => k.id === id), v = ($('#tReply').value || '').trim(); if(!v) return toast('Écris ta réponse.', 'bad');
      x.msgs.push({from:'staff', by:staffName(), t:v, at:Date.now()}); x.status = t.dataset.close ? 'closed' : 'waiting'; x.assigned = x.assigned || staffName(); x.live = false;
      const u = userBy(x.uid); bus('support-reply', {email:u.email, handle:u.handle, text:v}); log('Réponse au support', x.id+' · @'+u.handle, v.slice(0, 80)); save(); A.ticket = id; render(); toast('Réponse envoyée à '+u.legal.split(' ')[0]+'.'); break; }
    /* Équipe */
    case 'staff-new': staffModal(); break;
    case 'staff-edit': staffModal((A.staffRows || []).find(x => x.email === t.dataset.e)); break;
    case 'staff-save': saveStaff(t.dataset.e || ''); break;
    case 'staff-del': modal('<h2>Retirer l\'accès de '+esc(t.dataset.e)+' ?</h2><p>Cette personne ne pourra plus entrer dans l\'espace équipe. Ses actions restent dans le journal.</p><div class="acts"><button class="btn btn-ghost" data-act="close-modal">Annuler</button><button class="btn btn-bad" data-act="staff-del-go" data-e="'+esc(t.dataset.e)+'">Retirer l\'accès</button></div>'); break;
    case 'staff-del-go': TMDB.rpc('staff_remove', {p_email:t.dataset.e}).then(() => { closeModal(); toast('Accès retiré.'); A.staffRows = null; A.logRows = null; render(); }).catch(err => toast(err.message, 'bad')); break;
    case 'gen-pwd': $('#sfP').value = genPwd(); break;
    /* Journal et paramètres */
    case 'export-audit': download('takamatch-journal.csv', csv([['Date','Membre','Action','Détail']].concat((A.logRows || []).map(a => [fmt(Date.parse(a.at), true), a.actor_email || '', a.action, a.detail || ''])))); break;
    case 'save-settings': { const ch = []; $$('[data-set]').forEach(i => { const k = i.dataset.set, v = +i.value; if(v !== D.settings[k]){ ch.push(k+' : '+D.settings[k]+' → '+v); D.settings[k] = v; } });
      $$('[data-link]').forEach(i => { const k = i.dataset.link; if(i.value !== D.settings.links[k]){ ch.push(k+' : lien modifié'); D.settings.links[k] = i.value; } });
      if(!ch.length) return toast('Aucun changement.'); log('Paramètres modifiés', 'Plateforme', ch.join(' ; ')); save(); render(); toast('Paramètres enregistrés.'); break; }
    case 'reset-demo': modal('<h2>Réinitialiser la démo ?</h2><p>Toutes les données de l\'espace équipe reviennent à leur état de départ, y compris les comptes de l\'équipe et le journal.</p><div class="acts"><button class="btn btn-ghost" data-act="close-modal">Annuler</button><button class="btn btn-bad" data-act="reset-go">Réinitialiser</button></div>'); break;
    case 'reset-go': try{ localStorage.removeItem(KEY); }catch(err){} D = seedState(); log('Démo réinitialisée', 'Espace équipe', ''); A.modal = null; A.drawer = null; render(); break;
    case 'gres': { const u = userBy(id); $('#gres').hidden = true; $('#gq').value = ''; if(u){ log('Fiche utilisateur consultée', '@'+u.handle, 'Recherche globale'); openDrawer(() => userDrawer(userBy(id))); } break; }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset && (t.dataset.pr || t.dataset.fx || t.dataset.fxs)){ prixPreview(); return; }
  if(t.id === 'lgC'){ const d = t.value.replace(/\D/g, '').slice(0, 6); if(t.value !== d) t.value = d; if(d.length === 6) doLogin(); return; }
  if(t.dataset.chk !== undefined || t.matches('[data-chk]')){ const all = $$('[data-chk]').every(c => c.checked); const b = $('#vOk'); if(b) b.disabled = !all; return; }
  if(t.id === 'gq'){ const q = t.value.trim().toLowerCase(), g = $('#gres'); if(q.length < 2){ g.hidden = true; return; }
    const res = D.users.filter(u => [u.legal, u.handle, u.email, u.phone].join(' ').toLowerCase().includes(q)).slice(0, 8);
    g.innerHTML = res.length ? res.map(u => '<button data-act="gres" data-id="'+u.id+'">'+av(u)+'<span class="grow"><b style="display:block">'+esc(u.legal)+'</b><small class="hint">@'+esc(u.handle)+' · '+esc(u.email)+'</small></span>'+statusChip(u)+'</button>').join('') : '<p class="hint" style="padding:10px;margin:0">Aucun utilisateur.</p>';
    g.hidden = false; return; }
  const keep = (k, v) => { const pos = t.selectionStart; A.q[k] = v; render(); const n = $('[data-act="'+t.dataset.act+'"]'); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(err){} } };
  if(t.dataset.act === 'uq') return keep('users', t.value);
  if(t.dataset.act === 'payq') return keep('pay', t.value);
  if(t.dataset.act === 'auditq') return keep('audit', t.value);
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.act === 'uf'){ A.q.uf = Object.assign({}, A.q.uf, {[t.dataset.k]:t.value}); render(); }
  if(t.dataset.act === 'pf'){ A.q.pf = Object.assign({}, A.q.pf, {[t.dataset.k]:t.value}); render(); }
  if(t.dataset.act === 'aw'){ A.q.aw = t.value; render(); }
  if(t.dataset.act === 't-status'){ const x = D.tickets.find(k => k.id === t.dataset.id); x.status = t.value; log('Statut du ticket modifié', x.id, TST[t.value][0]); save(); render(); }
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('.zoom')){ $('.zoom').remove(); return; }
  if(A.modal){ closeModal(); return; }
  if(A.drawer){ A.drawer = null; paintOverlay(); }
});

/* ---------- Équipe : création et modification ---------- */
/* L'accès est accordé par adresse e-mail : la personne reçoit son rôle à sa
   première connexion sur l'espace équipe (code par e-mail, sans mot de passe). */
function staffModal(s){
  modal('<h2>'+(s ? 'Modifier l\'accès' : 'Ajouter un membre de l\'équipe')+'</h2><div class="col">'
    + '<div class="field"><label for="sfN">Nom affiché</label><input class="inp" id="sfN" value="'+esc(s ? (s.name || '') : '')+'" placeholder="Prénom Nom"></div>'
    + '<div class="field"><label for="sfE">Adresse e-mail</label><input class="inp" id="sfE" type="email" value="'+esc(s ? s.email : '')+'" placeholder="prenom@email.com"'+(s ? ' readonly' : '')+'></div>'
    + '<div class="field"><label for="sfR">Rôle</label><select class="inp" id="sfR">'+Object.keys(ROLES).map(k => '<option value="'+k+'"'+(s && s.admin_role === k ? ' selected' : '')+'>'+ROLES[k].l+' — '+ROLES[k].d+'</option>').join('')+'</select></div>'
    + '<p class="hint" style="margin:0">'+(s ? 'Le changement s\'applique à sa prochaine action.' : 'La personne se connecte sur cette même page avec son adresse : un code lui est envoyé par e-mail. Aucun mot de passe à transmettre.')+'</p></div>'
    + '<div class="acts"><button class="btn btn-ghost" data-act="close-modal">Annuler</button><button class="btn btn-a" data-act="staff-save" data-e="'+esc(s ? s.email : '')+'">'+(s ? 'Enregistrer' : 'Donner l\'accès')+'</button></div>');
}
async function saveStaff(){
  const n = $('#sfN').value.trim(), e = $('#sfE').value.trim().toLowerCase(), r = $('#sfR').value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) return toast('Adresse e-mail valide requise.', 'bad');
  try{
    const st = await TMDB.rpc('staff_upsert', {p_email:e, p_admin_role:r, p_name:n});
    closeModal(); A.staffRows = null; A.logRows = null; render();
    toast(st === 'invité' ? 'Accès prévu pour '+e+' : il sera actif à sa première connexion.' : 'Accès enregistré pour '+e+'.');
  }catch(err){ toast(err.message, 'bad'); }
}

/* ============================================================
   Lien avec la plateforme (TakaMatch.html ouvert dans le même navigateur)
   ============================================================ */
const BC = (() => { try{ return new BroadcastChannel('takamatch-staff'); }catch(e){ return null; } })();
function bus(type, data){
  const m = {id:uid()+Date.now().toString(36), type, data, at:Date.now(), from:'staff'};
  D.seen.push(m.id);
  try{ if(BC) BC.postMessage(m); }catch(e){}
  try{ const q = JSON.parse(localStorage.getItem('tm-bus') || '[]'); q.push(m); localStorage.setItem('tm-bus', JSON.stringify(q.slice(-150))); }catch(e){}
}
function ensureUser(c){
  let u = D.users.find(x => (c.email && x.email.toLowerCase() === String(c.email).toLowerCase()) || (c.handle && x.handle === c.handle));
  if(!u){ u = {id:'U-'+(1000 + D.users.length), legal:((c.first || '')+' '+(c.last || '')).trim() || '@'+c.handle, handle:c.handle || 'nouveau', email:c.email || '', phone:c.phone || '—',
      city:c.city || '—', sex:c.sex === 'f' ? 'f' : c.sex === 'm' ? 'm' : 'n', roles:c.roles || [c.role || 'tal'], primary:c.role || 'tal', created:Date.now(), lastSeen:Date.now(),
      status:'active', credits:c.role === 'vis' ? 3 : 0, verifiedEmail:true, verifiedPhone:false, verifiedId:!!c.verifiedId, notes:[], online:true, completion:80, invitesSent:0, invitesRecv:0, matches:0, live:true};
    D.users.unshift(u); }
  return u;
}
function onPlatform(m){
  if(!m || m.from !== 'app' || D.seen.includes(m.id)) return;
  D.seen.push(m.id); if(D.seen.length > 400) D.seen = D.seen.slice(-300);
  const d = m.data || {};
  let msg = '';
  if(m.type === 'signup'){ const u = ensureUser(d.user); msg = 'Nouvel inscrit : @'+u.handle; }
  if(m.type === 'verify-request'){ const u = ensureUser(d.user);
    D.verifs.unshift({id:'V-'+(3200 + D.verifs.length), uid:u.id, at:m.at, status:'pending', live:true, doc:d.doc || '', selfie:d.selfie || '', history:[]});
    msg = 'Nouveau dossier de vérification : @'+u.handle; }
  if(m.type === 'report'){ const by = ensureUser(d.by);
    D.reports.unshift({id:'R-'+(2100 + D.reports.length), at:m.at, prio:/argent|arnaque|usurpation/i.test(d.reason) ? 'high' : 'medium', kind:d.target.kind || 'profil', reason:d.reason, by:by.handle,
      target:String(d.target.handle || '').replace(/^@/,''), text:d.text, status:'new', live:true, notes:[]});
    msg = 'Nouveau signalement contre '+d.target.handle; }
  if(m.type === 'support'){ const u = ensureUser(d.by);
    D.tickets.unshift({id:'S-'+(600 + D.tickets.length), at:m.at, uid:u.id, topic:d.topic || 'Message', status:'open', live:true, msgs:[{from:'user', t:d.text, at:m.at}]});
    msg = 'Nouveau message au support de @'+u.handle; }
  save();
  if(A.me && msg){ toast(msg); const l = $('#live'); if(l){ l.classList.remove('pulse'); void l.offsetWidth; l.classList.add('pulse'); }
    if(!A.modal){ const keep = A.drawer; render(); A.drawer = keep; paintOverlay(); } }
}
if(BC) BC.onmessage = e => onPlatform(e.data);
addEventListener('storage', e => { if(e.key === 'tm-bus' && e.newValue){ try{ JSON.parse(e.newValue).forEach(onPlatform); }catch(err){} } });
/* Au chargement : ce qui est arrivé pendant que l'espace équipe était fermé. */
try{ JSON.parse(localStorage.getItem('tm-bus') || '[]').forEach(onPlatform); }catch(e){}

/* ---------- Démarrage ---------- */
render();
/* Session déjà ouverte sur cet appareil : on revérifie le rôle dans la base. */
(async () => { try{ if(await TMDB.ensure()) await enter(); }catch(e){} })();
</script>
</body>
</html>
